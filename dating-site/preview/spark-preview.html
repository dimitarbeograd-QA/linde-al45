<title>Spark — запознанства</title>
<style>
/* ═════════ Spark — тъмна тема със светлосин текст ═════════ */
:root {
  color-scheme: dark;
  /* Тези стойности се презаписват от персонализацията (js/app.js) */
  --bg: #070b14;
  --surface: #0f1626;
  --text: #bfe3ff;
  --heading: #ffffff;
  --accent: #5cc8ff;
  --border: #24477a;
  --radius: 16px;
  --bw: 1px;
  --glow: 0.4;
  --font-scale: 1;

  --muted: color-mix(in srgb, var(--text) 62%, transparent);
  --faint: color-mix(in srgb, var(--text) 14%, transparent);
  --surface-2: color-mix(in srgb, var(--surface) 80%, white 6%);
  --glow-shadow: 0 0 calc(28px * var(--glow)) color-mix(in srgb, var(--accent) calc(var(--glow) * 45%), transparent);
  --danger: #ff7a90;
  --ok: #6ee7b7;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html { font-size: calc(16px * var(--font-scale)); scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  line-height: 1.55; overflow-x: hidden;
}
h1, h2, h3, h4 { color: var(--heading); line-height: 1.2; margin: 0 0 .5em; letter-spacing: .01em; }
h1 { font-size: clamp(2rem, 5vw, 3.2rem); }
h2 { font-size: 1.6rem; } h3 { font-size: 1.15rem; }
p { margin: 0 0 1em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.dim { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
main:focus, main:focus-visible { outline: none; }
main { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 1.5rem 1rem 3rem; outline: none; }

/* ── Фон ── */
.bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-orbs i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .28; background: var(--accent); animation: drift 24s ease-in-out infinite alternate; }
.bg-orbs i:nth-child(1) { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax; }
.bg-orbs i:nth-child(2) { width: 38vmax; height: 38vmax; right: -10vmax; top: 20vh; background: color-mix(in srgb, var(--accent) 55%, #6a5cff); animation-duration: 30s; }
.bg-orbs i:nth-child(3) { width: 30vmax; height: 30vmax; left: 30vw; bottom: -16vmax; background: color-mix(in srgb, var(--accent) 60%, white); opacity: .16; animation-duration: 36s; }
@keyframes drift { to { transform: translate(6vw, 5vh) scale(1.15); } }

/* ── Горна лента ── */
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 1rem;
  padding: .65rem 1rem; flex-wrap: wrap;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: var(--bw) solid var(--border);
}
.brand { display: flex; align-items: center; gap: .5rem; color: var(--heading); font-weight: 800; font-size: 1.35rem; letter-spacing: .03em; }
.brand svg { color: var(--accent); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 70%, transparent)); transition: transform .5s var(--ease); }
.brand:hover { text-decoration: none; } .brand:hover svg { transform: rotate(-12deg) scale(1.15); }
.nav { display: flex; gap: .25rem; flex: 1; flex-wrap: wrap; }
.nav a { padding: .45rem .9rem; border-radius: 999px; color: var(--text); font-weight: 600; transition: background .25s, color .25s; }
.nav a:hover { background: var(--faint); text-decoration: none; }
.nav a.on { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--heading); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
.tools { display: flex; align-items: center; gap: .5rem .75rem; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; min-width: 0; max-width: 100%; }
.fontctl { display: flex; gap: 2px; }
.chip-btn { font: inherit; font-weight: 700; color: var(--text); background: var(--faint); border: var(--bw) solid var(--border); padding: .25rem .6rem; cursor: pointer; transition: background .2s, transform .15s; }
.fontctl .chip-btn:first-child { border-radius: 10px 0 0 10px; } .fontctl .chip-btn:last-child { border-radius: 0 10px 10px 0; }
.chip-btn:hover { background: color-mix(in srgb, var(--accent) 25%, transparent); } .chip-btn:active { transform: scale(.94); }
.userbox { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; min-width: 0; }
.userbox .who { font-weight: 700; color: var(--heading); max-width: 14ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 640px) {
  .topbar { gap: .5rem; }
  .tools { width: 100%; margin-left: 0; justify-content: space-between; }
  .nav { order: 3; width: 100%; }
  .nav a { padding: .4rem .7rem; }
}

/* ── „Прозорци“ (карти) ── */
.win {
  position: relative; background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: var(--bw) solid var(--border); border-radius: var(--radius);
  box-shadow: var(--glow-shadow), 0 12px 40px rgba(0, 0, 0, .35);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.win > .win-head {
  display: flex; align-items: center; gap: .6rem; padding: .7rem 1rem; border-bottom: var(--bw) solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent);
}
.win-head h2, .win-head h3 { margin: 0; font-size: 1.05rem; }
.dots { display: inline-flex; gap: 6px; } .dots b { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); box-shadow: inset 0 0 0 1px var(--border); }
.dots b:first-child { background: color-mix(in srgb, var(--accent) 80%, transparent); }
.win-body { padding: 1.1rem 1.2rem; }
.enter { animation: fadeUp .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }

/* ── Форми и бутони ── */
label { display: block; font-weight: 600; margin-bottom: .3rem; color: var(--heading); font-size: .92rem; }
input, select, textarea {
  width: 100%; font: inherit; color: var(--heading); background: color-mix(in srgb, var(--bg) 70%, var(--surface));
  border: var(--bw) solid var(--border); border-radius: calc(var(--radius) * .6); padding: .6rem .8rem;
  transition: border-color .2s, box-shadow .2s;
}
input::placeholder, textarea::placeholder { color: var(--muted); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
select option { background: var(--surface); color: var(--heading); }
textarea { resize: vertical; min-height: 7rem; }
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--accent); }
input[type=range] { padding: 0; accent-color: var(--accent); }
input[type=color] { padding: 2px; height: 2.4rem; width: 3.4rem; cursor: pointer; }
.field { margin-bottom: 1rem; } .row { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.hint { font-size: .82rem; color: var(--muted); margin-top: .25rem; }
.err { color: var(--danger); font-weight: 600; margin: .5rem 0; min-height: 1.2em; }

.btn {
  font: inherit; font-weight: 700; cursor: pointer; color: #04101c; border: 0; border-radius: 999px;
  padding: .65rem 1.4rem; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, white));
  box-shadow: var(--glow-shadow); transition: transform .2s var(--ease), box-shadow .2s, filter .2s; position: relative; overflow: hidden;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.08); } .btn:active { transform: translateY(0) scale(.97); }
.btn[disabled] { opacity: .55; cursor: not-allowed; transform: none; }
.btn.ghost { color: var(--heading); background: transparent; border: var(--bw) solid var(--border); box-shadow: none; }
.btn.ghost:hover { background: var(--faint); }
.btn.danger { background: transparent; color: var(--danger); border: var(--bw) solid color-mix(in srgb, var(--danger) 60%, transparent); box-shadow: none; }
.btn.sm { padding: .35rem .9rem; font-size: .88rem; }
.btn.block { width: 100%; }

.tabs { display: flex; gap: .25rem; padding: .3rem; background: var(--faint); border-radius: 999px; margin-bottom: 1.1rem; }
.tabs button { flex: 1; font: inherit; font-weight: 700; color: var(--text); background: transparent; border: 0; border-radius: 999px; padding: .5rem; cursor: pointer; transition: background .25s, color .25s; }
.tabs button[aria-selected=true] { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--heading); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }

.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { font: inherit; font-size: .88rem; cursor: pointer; color: var(--text); background: transparent; border: var(--bw) solid var(--border); border-radius: 999px; padding: .28rem .8rem; transition: all .2s var(--ease); }
.chip:hover { border-color: var(--accent); transform: translateY(-1px); }
.chip[aria-pressed=true] { background: color-mix(in srgb, var(--accent) 24%, transparent); border-color: var(--accent); color: var(--heading); }
.tag { display: inline-block; font-size: .78rem; padding: .12rem .6rem; border-radius: 999px; border: var(--bw) solid var(--border); background: var(--faint); }
.tag.demo { border-style: dashed; color: var(--muted); }

/* ── Начална страница ── */
.hero { display: grid; gap: 2rem; grid-template-columns: 1.15fr .85fr; align-items: center; padding: 1rem 0 2rem; }
.hero h1 span { color: var(--accent); text-shadow: 0 0 calc(30px * var(--glow)) var(--accent); }
.hero .lead { font-size: 1.15rem; max-width: 36rem; }
.stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 1.5rem 0; }
.stat b { display: block; font-size: 1.8rem; color: var(--heading); } .stat span { color: var(--muted); font-size: .9rem; }
.feat { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 1rem; }
.feat .win-body h3 { display: flex; align-items: center; gap: .5rem; }
.feat .ico { font-size: 1.4rem; }
.cityline { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

/* ── Открий ── */
.layout { display: grid; grid-template-columns: 300px 1fr; gap: 1.2rem; align-items: start; }
.sidebar { position: sticky; top: 5.2rem; max-height: calc(100vh - 6.5rem); overflow: auto; }
.cities { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; }
.city { text-align: left; font: inherit; cursor: pointer; color: var(--text); background: transparent; border: var(--bw) solid var(--border); border-radius: calc(var(--radius) * .7); padding: .5rem .7rem; display: flex; justify-content: space-between; gap: .4rem; transition: all .22s var(--ease); }
.city:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--glow-shadow); }
.city[aria-pressed=true] { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); color: var(--heading); }
.city small { color: var(--muted); font-weight: 700; } .city.empty { opacity: .55; }
.citybar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
.citybar h2 { margin: 0; flex: 1; min-width: 12rem; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { cursor: pointer; overflow: hidden; padding: 0; text-align: left; font: inherit; color: inherit; transition: transform .3s var(--ease), box-shadow .3s, border-color .3s; }
.card:hover, .card:focus-visible { transform: translateY(-6px) scale(1.01); border-color: var(--accent); box-shadow: 0 0 calc(40px * var(--glow) + 8px) color-mix(in srgb, var(--accent) 50%, transparent), 0 16px 40px rgba(0,0,0,.45); }
.card .ph { aspect-ratio: 4 / 5; background: var(--faint); position: relative; overflow: hidden; border-radius: calc(var(--radius) - var(--bw)) calc(var(--radius) - var(--bw)) 0 0; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
.card:hover .ph img { transform: scale(1.07); }
.card .ph::after { content: ''; position: absolute; inset: 55% 0 0; background: linear-gradient(transparent, rgba(0,0,0,.72)); }
.card .over { position: absolute; left: .8rem; right: .8rem; bottom: .6rem; z-index: 1; color: #fff; }
.card .over b { font-size: 1.15rem; display: block; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.card .meta { padding: .7rem .9rem .9rem; font-size: .9rem; }
.card .meta p { margin: 0 0 .5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); }
.dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); margin-right: .3rem; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.badge-tr { position: absolute; top: .6rem; right: .6rem; z-index: 2; }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.empty-state .big { font-size: 3rem; }
.fgroup { margin-bottom: 1rem; } .fgroup > label { margin-bottom: .45rem; }
.agepair { display: flex; align-items: center; gap: .5rem; } .agepair input { text-align: center; }
.checkline { display: flex; gap: .5rem; align-items: center; margin: .35rem 0; font-weight: 500; }
.checkline label { margin: 0; font-weight: 500; color: var(--text); }
.filter-toggle { display: none; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; } .sidebar { position: static; max-height: none; }
  .filter-toggle { display: inline-block; margin-bottom: .8rem; } .sidebar.closed { display: none; }
}

/* ── Модален прозорец ── */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(2, 5, 12, .72); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(900px, 100%); max-height: calc(100vh - 2rem); overflow: auto; animation: pop .4s var(--ease) both; }
.modal.narrow { width: min(460px, 100%); }
@keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.94); } }
.xbtn { margin-left: auto; font: inherit; font-size: 1.2rem; line-height: 1; cursor: pointer; color: var(--text); background: transparent; border: 0; border-radius: 8px; padding: .2rem .55rem; }
.xbtn:hover { background: var(--faint); color: var(--heading); }
.pview { display: grid; grid-template-columns: 1.05fr 1fr; gap: 1.3rem; }
.gallery .main { aspect-ratio: 4 / 5; border-radius: calc(var(--radius) * .7); overflow: hidden; background: var(--faint); border: var(--bw) solid var(--border); }
.gallery .main img { width: 100%; height: 100%; object-fit: cover; display: block; animation: fade .4s both; }
.thumbs { display: flex; gap: .4rem; margin-top: .5rem; flex-wrap: wrap; }
.thumbs button { width: 56px; height: 56px; padding: 0; border-radius: 10px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: var(--faint); transition: border-color .2s, transform .2s; }
.thumbs button:hover { transform: translateY(-2px); } .thumbs button[aria-current=true] { border-color: var(--accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; margin: 0 0 1rem; } .facts dt { color: var(--muted); } .facts dd { margin: 0; color: var(--heading); font-weight: 600; }
.bio { white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
@media (max-width: 720px) { .pview { grid-template-columns: 1fr; } }

/* ── Профил / снимки ── */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .7rem; }
.ph-item { position: relative; aspect-ratio: 4 / 5; border-radius: calc(var(--radius) * .6); overflow: hidden; border: var(--bw) solid var(--border); background: var(--faint); animation: pop .4s var(--ease) both; }
.ph-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-item .ctl { position: absolute; inset: auto 0 0 0; display: flex; gap: 4px; padding: 6px; background: linear-gradient(transparent, rgba(0,0,0,.8)); opacity: 0; transition: opacity .2s; }
.ph-item:hover .ctl, .ph-item:focus-within .ctl { opacity: 1; }
@media (hover: none) { .ph-item .ctl { opacity: 1; } }
.ph-item .ctl button { flex: 1; font: inherit; font-size: .75rem; padding: .25rem; border-radius: 8px; border: 0; cursor: pointer; background: rgba(255,255,255,.16); color: #fff; }
.ph-item .ctl button:hover { background: var(--accent); color: #04101c; }
.ph-item .main-tag { position: absolute; top: 6px; left: 6px; font-size: .7rem; padding: .1rem .5rem; border-radius: 999px; background: var(--accent); color: #04101c; font-weight: 800; }
.dropzone { display: grid; place-items: center; text-align: center; aspect-ratio: 4 / 5; border: 2px dashed var(--border); border-radius: calc(var(--radius) * .6); cursor: pointer; color: var(--muted); transition: border-color .2s, background .2s, transform .2s; font: inherit; background: transparent; }
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--faint); transform: scale(1.02); color: var(--heading); }
.two { display: grid; gap: 1.2rem; grid-template-columns: 1fr 1fr; align-items: start; } @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.stack > * + * { margin-top: 1.2rem; }
.counter { text-align: right; font-size: .8rem; color: var(--muted); }

/* ── Настройки на темата ── */
.swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .8rem 1.2rem; }
.swatch { display: flex; align-items: center; gap: .7rem; } .swatch label { margin: 0; flex: 1; } .swatch code { font-size: .8rem; color: var(--muted); }
.presets { display: flex; flex-wrap: wrap; gap: .6rem; }
.preset { font: inherit; cursor: pointer; border-radius: 12px; padding: .5rem .9rem; border: var(--bw) solid var(--border); background: var(--faint); color: var(--heading); display: flex; gap: .5rem; align-items: center; transition: transform .2s, border-color .2s; }
.preset:hover { transform: translateY(-2px); border-color: var(--accent); }
.preset i { width: 1rem; height: 1rem; border-radius: 50%; display: inline-block; }
.slider { margin-bottom: 1rem; } .slider output { float: right; color: var(--accent); font-weight: 700; }
.live { padding: 1rem; border-radius: var(--radius); border: var(--bw) solid var(--border); background: var(--surface); box-shadow: var(--glow-shadow); }

/* ── Тостове ── */
#toasts { position: fixed; z-index: 200; bottom: 1rem; left: 50%; transform: translateX(-50%); display: grid; gap: .5rem; width: min(92vw, 420px); pointer-events: none; }
.toast { pointer-events: auto; padding: .7rem 1rem; border-radius: 14px; background: var(--surface); color: var(--heading); border: var(--bw) solid var(--accent); box-shadow: var(--glow-shadow), 0 10px 30px rgba(0,0,0,.5); animation: fadeUp .35s var(--ease) both; }
.toast.error { border-color: var(--danger); }
.foot { display: flex; justify-content: space-between; gap: .6rem; flex-wrap: wrap; padding: 1rem; border-top: var(--bw) solid var(--border); font-size: .85rem; color: var(--muted); }
.spinner { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 3px solid var(--faint); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 2rem auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Без анимации ── */
.no-anim *, .no-anim *::before, .no-anim *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

html, body { height: auto; }
</style>
<div class="bg-orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="topbar" id="topbar">
  <a class="brand" href="#" aria-label="Spark — начало">
    <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><path d="M34 6 18 36h12l-3 22 19-32H33z" fill="currentColor"/></svg><span>Spark</span>
  </a>
  <nav class="nav" id="nav" aria-label="Основна навигация"></nav>
  <div class="tools">
    <div class="fontctl" role="group" aria-label="Размер на шрифта">
      <button type="button" class="chip-btn" id="fontDown" aria-label="По-малък шрифт" title="По-малък шрифт">A−</button>
      <button type="button" class="chip-btn" id="fontReset" aria-label="Нормален шрифт" title="Нормален размер">A</button>
      <button type="button" class="chip-btn" id="fontUp" aria-label="По-голям шрифт" title="По-голям шрифт">A+</button>
    </div>
    <div id="userbox"></div>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<footer class="foot"><span>© Spark · само за лица над 18 години</span><span class="dim">Профилите с значка „демо“ са примерни.</span></footer>

<script>
// Статичен преглед: имитира /api/* в браузъра (без сървър). Данните са само в този браузър.
(() => {
  'use strict';
  const D = window.__SPARK_PREVIEW__; // { cities, interests, people:[{...}] }
  const KEY = 'spark.preview.v1';
  window.confirm = () => true; // в прегледа диалозите са недостъпни
  const MIN_AGE = 18, MAX_PHOTOS = 6;
  let db = { users: [], likes: [], seq: 1000, session: null };
  try { const raw = localStorage.getItem(KEY); if (raw) db = JSON.parse(raw); } catch { /* без storage */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { /* ignore */ } };

  const demo = D.people.map((p, i) => ({ ...p, id: i + 1, isDemo: true, photos: [], lastMin: (i * 37) % 600, likesBase: (i * 5) % 7, created: i }));
  const all = () => demo.concat(db.users);
  const ageFrom = b => { const d = new Date(b), n = new Date(); let a = n.getFullYear() - d.getFullYear(); if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--; return a; };
  const hash = s => { let h = 5381; for (const c of s) h = ((h * 33) ^ c.codePointAt(0)) >>> 0; return String(h); };
  const NICK = /^[\p{L}\p{N}][\p{L}\p{N} _.-]{1,18}[\p{L}\p{N}]$/u, USER = /^[A-Za-z0-9_.-]{3,30}$/;
  const ok = (data, status = 200) => new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  const bad = (msg, status = 400) => ok({ error: msg }, status);
  const meUser = () => db.users.find(u => u.id === db.session);

  function pub(u, viewer) {
    const likes = db.likes.filter(l => l.to === u.id).length + (u.likesBase || 0);
    return {
      id: u.id, nickname: u.nickname, age: u.isDemo ? u.age : ageFrom(u.birthDate), gender: u.gender, lookingFor: u.lookingFor, city: u.city,
      bio: u.bio, interests: [...u.interests].sort(), photos: u.photos.map(p => ({ id: p.id, url: p.url })), isDemo: !!u.isDemo,
      online: u.isDemo ? u.lastMin < 5 : true, liked: db.likes.some(l => l.from === viewer && l.to === u.id),
      likedMe: db.likes.some(l => l.from === u.id && l.to === viewer), likes, isMe: u.id === viewer,
    };
  }
  const full = u => ({ ...pub(u, u.id), username: u.username, birthDate: u.birthDate, theme: u.theme || null });

  const routes = [];
  const route = (m, re, fn) => routes.push([m, re, fn]);

  route('GET', /^\/api\/meta$/, () => ok({
    cities: D.cities.map(name => ({ name, count: all().filter(u => u.city === name).length })),
    interests: D.interests, minAge: MIN_AGE, maxPhotos: MAX_PHOTOS, total: all().length,
  }));
  route('GET', /^\/api\/me$/, () => ok({ user: meUser() ? full(meUser()) : null }));

  route('POST', /^\/api\/register$/, ({ body: b }) => {
    const username = String(b.username || '').trim(), nickname = String(b.nickname || '').trim().replace(/\s+/g, ' '), password = String(b.password || '');
    if (!USER.test(username)) return bad('Потребителското име трябва да е 3–30 символа: латински букви, цифри, . _ -');
    if (!NICK.test(nickname)) return bad('Никнеймът трябва да е 3–20 символа (букви, цифри, интервал, . _ -).');
    if (password.length < 8) return bad('Паролата трябва да е поне 8 символа.');
    if (!b.birthDate || isNaN(new Date(b.birthDate))) return bad('Невалидна дата на раждане.');
    const age = ageFrom(b.birthDate);
    if (age < MIN_AGE) return bad('Сайтът е само за пълнолетни (18+).');
    if (age > 99) return bad('Невалидна дата на раждане.');
    if (!['male', 'female', 'other'].includes(b.gender)) return bad('Изберете пол.');
    if (!D.cities.includes(b.city)) return bad('Изберете град от списъка.');
    if (db.users.some(u => u.username.toLowerCase() === username.toLowerCase())) return bad('Това потребителско име е заето.', 409);
    if (all().some(u => u.nickname.toLowerCase() === nickname.toLowerCase())) return bad('Този никнейм е зает.', 409);
    const u = { id: ++db.seq, username, pw: hash(password), nickname, birthDate: b.birthDate, gender: b.gender, lookingFor: ['male', 'female', 'any'].includes(b.lookingFor) ? b.lookingFor : 'any',
      city: b.city, bio: '', interests: [], photos: [], theme: null, created: 1000 + db.seq };
    db.users.push(u); db.session = u.id; save();
    return ok({ user: full(u) }, 201);
  });
  route('POST', /^\/api\/login$/, ({ body: b }) => {
    const u = db.users.find(x => x.username.toLowerCase() === String(b.username || '').trim().toLowerCase());
    if (!u || u.pw !== hash(String(b.password || ''))) return bad('Грешно потребителско име или парола.', 401);
    db.session = u.id; save(); return ok({ user: full(u) });
  });
  route('POST', /^\/api\/logout$/, () => { db.session = null; save(); return ok({ ok: true }); });

  const authed = fn => args => meUser() ? fn({ ...args, me: meUser() }) : bad('Трябва да влезете в профила си.', 401);

  route('PUT', /^\/api\/me$/, authed(({ body: b, me }) => {
    if (b.nickname !== undefined) {
      const n = String(b.nickname).trim().replace(/\s+/g, ' ');
      if (!NICK.test(n)) return bad('Никнеймът трябва да е 3–20 символа (букви, цифри, интервал, . _ -).');
      if (all().some(u => u.id !== me.id && u.nickname.toLowerCase() === n.toLowerCase())) return bad('Този никнейм е зает.', 409);
      me.nickname = n;
    }
    if (['male', 'female', 'other'].includes(b.gender)) me.gender = b.gender;
    if (['male', 'female', 'any'].includes(b.lookingFor)) me.lookingFor = b.lookingFor;
    if (D.cities.includes(b.city)) me.city = b.city;
    if (b.bio !== undefined) { if (String(b.bio).length > 600) return bad('Биото може да е до 600 символа.'); me.bio = String(b.bio).trim(); }
    if (Array.isArray(b.interests)) me.interests = [...new Set(b.interests.filter(x => D.interests.includes(x)))].slice(0, 8);
    save(); return ok({ user: full(me) });
  }));
  route('PUT', /^\/api\/me\/password$/, authed(({ body: b, me }) => {
    if (me.pw !== hash(String(b.current || ''))) return bad('Текущата парола е грешна.', 403);
    if (String(b.next || '').length < 8) return bad('Новата парола трябва да е 8–72 символа.');
    me.pw = hash(b.next); save(); return ok({ ok: true });
  }));
  route('PUT', /^\/api\/me\/theme$/, authed(({ body: b, me }) => { me.theme = b.theme || null; save(); return ok({ theme: me.theme }); }));
  route('DELETE', /^\/api\/me$/, authed(({ body: b, me }) => {
    if (me.pw !== hash(String(b.password || ''))) return bad('Паролата е грешна.', 403);
    db.users = db.users.filter(u => u.id !== me.id); db.likes = db.likes.filter(l => l.from !== me.id && l.to !== me.id); db.session = null; save(); return ok({ ok: true });
  }));

  route('POST', /^\/api\/me\/photos$/, authed(({ body: b, me }) => {
    if (!/^data:image\/(jpeg|png|webp);base64,/.test(String(b.dataUrl || ''))) return bad('Невалиден файл. Позволени са JPG, PNG и WebP.');
    if (me.photos.length >= MAX_PHOTOS) return bad(`Можете да качите най-много ${MAX_PHOTOS} снимки.`);
    me.photos.push({ id: ++db.seq, url: b.dataUrl }); save(); return ok({ user: full(me) }, 201);
  }));
  route('DELETE', /^\/api\/me\/photos\/(\d+)$/, authed(({ m, me }) => {
    const i = me.photos.findIndex(p => p.id === Number(m[1])); if (i < 0) return bad('Снимката не е намерена.', 404);
    me.photos.splice(i, 1); save(); return ok({ user: full(me) });
  }));
  route('PUT', /^\/api\/me\/photos\/(\d+)\/main$/, authed(({ m, me }) => {
    const i = me.photos.findIndex(p => p.id === Number(m[1])); if (i < 0) return bad('Снимката не е намерена.', 404);
    me.photos.unshift(me.photos.splice(i, 1)[0]); save(); return ok({ user: full(me) });
  }));

  route('GET', /^\/api\/profiles$/, authed(({ q, me }) => {
    let list = all().filter(u => u.id !== me.id);
    if (q.get('city')) list = list.filter(u => u.city === q.get('city'));
    if (q.get('gender')) list = list.filter(u => u.gender === q.get('gender'));
    const age = u => (u.isDemo ? u.age : ageFrom(u.birthDate));
    if (q.get('ageMin')) list = list.filter(u => age(u) >= Number(q.get('ageMin')));
    if (q.get('ageMax')) list = list.filter(u => age(u) <= Number(q.get('ageMax')));
    if (q.get('withPhoto') === '1') list = list.filter(u => u.photos.length);
    if (q.get('online') === '1') list = list.filter(u => !u.isDemo || u.lastMin < 5);
    if (q.get('lookingForMe') === '1') list = list.filter(u => u.lookingFor === 'any' || u.lookingFor === (me.gender === 'other' ? 'any' : me.gender));
    const ints = q.getAll('interest'); if (ints.length) list = list.filter(u => u.interests.some(i => ints.includes(i)));
    const term = (q.get('q') || '').trim().toLowerCase(); if (term) list = list.filter(u => u.nickname.toLowerCase().includes(term));
    const sorts = { active: (a, b) => (a.lastMin ?? 0) - (b.lastMin ?? 0), new: (a, b) => b.created - a.created, young: (a, b) => age(a) - age(b), old: (a, b) => age(b) - age(a) };
    list.sort(sorts[q.get('sort')] || sorts.active);
    const limit = Math.min(48, Number(q.get('limit')) || 12), offset = Number(q.get('offset')) || 0;
    return ok({ total: list.length, offset, profiles: list.slice(offset, offset + limit).map(u => pub(u, me.id)) });
  }));
  route('GET', /^\/api\/profiles\/(\d+)$/, authed(({ m, me }) => {
    const u = all().find(x => x.id === Number(m[1])); return u ? ok({ profile: pub(u, me.id) }) : bad('Профилът не е намерен.', 404);
  }));
  route('POST', /^\/api\/profiles\/(\d+)\/like$/, authed(({ m, me }) => {
    const id = Number(m[1]), u = all().find(x => x.id === id);
    if (!u) return bad('Профилът не е намерен.', 404);
    if (id === me.id) return bad('Не можете да харесате себе си.');
    const i = db.likes.findIndex(l => l.from === me.id && l.to === id);
    if (i >= 0) db.likes.splice(i, 1); else db.likes.push({ from: me.id, to: id });
    // Демо профил „отвръща“ на харесване, за да се види взаимността.
    if (u.isDemo && i < 0 && id % 3 === 0 && !db.likes.some(l => l.from === id && l.to === me.id)) db.likes.push({ from: id, to: me.id });

  }));

  const realFetch = window.fetch.bind(window);
  window.fetch = async (url, opt = {}) => {
    const u = new URL(String(url), 'http://x');
    if (!u.pathname.startsWith('/api/')) return realFetch(url, opt);
    const method = (opt.method || 'GET').toUpperCase();
    let body = {}; try { body = opt.body ? JSON.parse(opt.body) : {}; } catch { /* ignore */ }
    for (const [m, re, fn] of routes) {
      const match = re.exec(u.pathname);
      if (m === method && match) { await new Promise(r => setTimeout(r, 60)); return fn({ body, q: u.searchParams, m: match }); }
    }
    return bad('Няма такъв маршрут.', 404);
  };

  // Бележка в долния ред
  document.addEventListener('DOMContentLoaded', () => {
    const f = document.querySelector('.foot');
    if (f) { const s = document.createElement('span'); s.className = 'dim'; s.textContent = 'Преглед: данните ти остават само в този браузър.'; f.append(s); }

  const el = document.createElement(tag);

      for (const decl of String(v).split(';')) {

        if (i > 0) el.style.setProperty(decl.slice(0, i).trim(), decl.slice(i + 1).trim());
      }
    }
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);

function resizeImage(file, maxSide = 1100) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return reject(new Error('Позволени са само JPG, PNG и WebP.'));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Файлът не може да бъде прочетен като снимка.')); };
    img.src = url;
  });
}

    h('p', { text: 'Това действие е необратимо. Въведи паролата си, за да потвърдиш.' }),
    h('div', { class: 'field' }, h('label', { for: 'del-pw', text: 'Парола' }), pw), err,
    h('div', { class: 'actions' }, h('button', { class: 'btn danger', type: 'submit', text: 'Изтрий завинаги' }), h('button', { class: 'btn ghost', type: 'button', text: 'Отказ', onclick: closeModal }))),
  { narrow: true, title: 'Изтриване на профил' });
}

/* ═══════════ Маршрутизация ═══════════ */
function currentRoute() {
  const r = (location.hash || '#').replace(/^#\/?/, '').split('?')[0];
  return ['discover', 'profile', 'settings'].includes(r) ? r : '';
}
function route() {
  closeModal();
  let r = currentRoute();
  if (!state.me && r !== 'settings') r = '';
  if (state.me && r === '') { r = 'discover'; history.replaceState(null, '', '#discover'); }
  renderChrome();
  if (!state.meta) return;
  ({ '': viewLanding, discover: viewDiscover, profile: viewProfile, settings: viewSettings })[r]();
  window.scrollTo(0, 0);
  const main = $('#view'); if (main) main.focus({ preventScroll: true });
  document.title = ({ '': 'Spark — запознанства', discover: 'Открий хора · Spark', profile: 'Моят профил · Spark', settings: 'Дизайн и настройки · Spark' })[r];
}

/* ═══════════ Старт ═══════════ */
async function init() {
  loadLocalTheme();
  $('#fontUp').addEventListener('click', () => changeTheme({ fontScale: Math.min(150, theme.fontScale + 10) }));
  $('#fontDown').addEventListener('click', () => changeTheme({ fontScale: Math.max(80, theme.fontScale - 10) }));
  $('#fontReset').addEventListener('click', () => changeTheme({ fontScale: 100 }));
  window.addEventListener('hashchange', route);
  clear($('#view')).append(h('div', { class: 'spinner', role: 'progressbar', 'aria-label': 'Зареждане' }));
  try {
    const [meta, me] = await Promise.all([api('GET', '/api/meta'), api('GET', '/api/me')]);
    state.meta = meta; state.me = me.user;
    adoptServerTheme(me.user);
  } catch (x) {
    clear($('#view')).append(h('div', { class: 'win' }, h('div', { class: 'win-body empty-state' }, h('div', { class: 'big', text: '⚠️' }), h('h2', { text: 'Сървърът не отговаря' }), h('p', { text: x.message }), h('button', { class: 'btn', type: 'button', text: 'Опитай пак', onclick: () => location.reload() }))));
    return;
  }
  route();
}
init();
})();

</script>
